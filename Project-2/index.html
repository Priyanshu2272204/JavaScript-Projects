<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Note Card Stack</title>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <div class="form-container">
        <h2>New Call</h2>
        <form>
            <label for="image-url">Image URL</label>
            <input id="image-url" required type="url" placeholder="https://example.com/photo.jpg" autocomplete="url" />

            <label for="full-name">Full Name</label>
            <input id="full-name" required type="text" placeholder="Enter full name" autocomplete="name" />

            <label for="home-town">Home Town</label>
            <input id="home-town" required type="text" placeholder="Enter home town" />

            <label for="purpose">Purpose</label>
            <input id="purpose" required type="text" placeholder="e.g., Quick appointment note" />

            <label>Category</label>
            <label class="tag-checkbox">
                <input required type="radio" name="category" value="emergency" />
                <span>Emergency</span>
            </label>

            <label class="tag-checkbox">
                <input required type="radio" name="category" value="important" />
                <span>Important</span>
            </label>

            <label class="tag-checkbox">
                <input required type="radio" name="category" value="urgent" />
                <span>Urgent</span>
            </label>

            <label class="tag-checkbox">
                <input required type="radio" name="category" value="no-rush" />
                <span>No Rush</span>
            </label>

            <button class="submit-btn" type="submit">Create Note</button>
        </form>
        <button class="closeForm" type="button">Close</button>
    </div>
    <div class="note-container">
        <div class="left-icons">
            <button id="add-note" type="button" aria-label="Add note"><i class="ri-add-line"
                    aria-hidden="true"></i></button>
            <button id="upBtn" type="button" aria-label="Move next card to front"><i class="ri-arrow-up-line"
                    aria-hidden="true"></i></button>
            <button id="downBtn" type="button" aria-label="Move front card to back"><i class="ri-arrow-down-line"
                    aria-hidden="true"></i></button>
        </div>

        <div class="stack">

        </div>

        <div class="right-colors">
            <span class="dot black"></span>
            <span class="dot purple"></span>
            <span class="dot orange"></span>
            <span class="dot teal"></span>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
